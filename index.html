<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Knife Hit Master</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 850px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            background-image: url('Images/Background.png');
            background-color: #1a1a24;
            background-size: cover;
            background-position: center;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            color: white;
        }
        .header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            width: 100%;
        }
        .score-container {
            font-size: 28px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        }
        .apple-container {
            display: flex;
            align-items: center;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        }
        .apple-icon {
            width: 30px;
            height: 30px;
            margin-right: 5px;
            background-image: url('Images/AppleB.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }
        .level-badge {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 22px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 1px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        #screen-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 15, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            color: white;
            z-index: 10;
            padding: 20px;
        }
        #screen-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .title {
            font-size: 42px;
            font-weight: 800;
            margin-bottom: 5px;
            color: #ff3b30;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .subtitle {
            font-size: 16px;
            margin-bottom: 25px;
            color: #aaa;
            text-align: center;
        }
        .btn {
            background: #4cd964;
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(76, 217, 100, 0.4);
            transition: transform 0.1s, background-color 0.2s;
            margin-bottom: 30px;
        }
        .btn:active {
            transform: scale(0.95);
            background: #3ee059;
        }
        
        /* Skin Shop Section */
        .skin-section-title {
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #fff;
            margin-bottom: 12px;
            font-weight: bold;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 5px;
            width: 80%;
            text-align: center;
        }
        .skins-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            width: 90%;
            max-width: 360px;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .skin-card {
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid transparent;
            border-radius: 10px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
            height: 80px;
        }
        .skin-card.locked {
            opacity: 0.35;
            cursor: not-allowed;
            background: rgba(0, 0, 0, 0.6);
        }
        .skin-card.selected {
            border-color: #4cd964;
            background: rgba(76, 217, 100, 0.15);
        }
        .skin-preview {
            width: 100%;
            height: 45px;
            object-fit: contain;
            transform: rotate(-45deg);
        }
        .skin-fallback-icon {
            font-size: 20px;
            color: #fff;
        }
        .skin-label {
            font-size: 10px;
            color: #ccc;
            margin-top: 5px;
            text-align: center;
            font-weight: 600;
        }
        .skin-card.locked::after {
            content: '🔒';
            position: absolute;
            font-size: 12px;
            top: 5px;
            right: 5px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui-layer">
            <div class="header-info">
                <div class="score-container">SCORE: <span id="score-val">0</span></div>
                <div class="level-badge">STAGE <span id="level-val">1</span></div>
                <div class="apple-container">
                    <div class="apple-icon"></div>
                    <span id="apple-val">0</span>
                </div>
            </div>
        </div>

        <div id="screen-overlay" class="active">
            <h1 class="title" id="overlay-title">Knife Hit</h1>
            <p class="subtitle" id="overlay-subtitle">Collect apples for extra lives!</p>
            <button class="btn" id="action-btn">PLAY</button>
            
            <div class="skin-section-title">Select Knife Skin</div>
            <div class="skins-grid" id="skins-container">
                <!-- Loaded Dynamically via JS -->
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreVal = document.getElementById('score-val');
        const levelVal = document.getElementById('level-val');
        const appleVal = document.getElementById('apple-val');
        const overlay = document.getElementById('screen-overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlaySubtitle = document.getElementById('overlay-subtitle');
        const actionBtn = document.getElementById('action-btn');
        const skinsContainer = document.getElementById('skins-container');

        const images = {};
        const assetPaths = {
            log: 'Images/LogB.png',
            knife: 'Images/KnifeB.png',
            apple: 'Images/AppleB.png',
            appleCut: 'Images/applecutB.png',
            skin1: 'Images/skin1.png',
            skin2: 'Images/skin2.png',
            skin3: 'Images/skin3.png',
            skin4: 'Images/skin4.png',
            skin5: 'Images/skin5.png',
            skin6: 'Images/skin6.png'
        };

        const skinConfig = [
            { key: 'knife', name: 'Default', reqLevel: 1 },
            { key: 'skin1', name: 'Skin 1', reqLevel: 2 }, // Unlocks on clearing lvl 1
            { key: 'skin2', name: 'Skin 2', reqLevel: 3 }, // Unlocks on clearing lvl 2
            { key: 'skin3', name: 'Skin 3', reqLevel: 4 },
            { key: 'skin4', name: 'Skin 4', reqLevel: 5 },
            { key: 'skin5', name: 'Skin 5', reqLevel: 6 },
            { key: 'skin6', name: 'Skin 6', reqLevel: 7 }
        ];

        // Permanent LocalStorage Unlocks Setup
        let unlockedSkins = JSON.parse(localStorage.getItem('kh_unlocked_skins')) || ['knife'];
        let currentSkinKey = localStorage.getItem('kh_current_skin') || 'knife';

        let assetsLoaded = 0;
        const totalAssets = Object.keys(assetPaths).length;

        function loadAssets(callback) {
            for (let key in assetPaths) {
                images[key] = new Image();
                images[key].src = assetPaths[key];
                images[key].onload = () => {
                    assetsLoaded++;
                    if (assetsLoaded === totalAssets) callback();
                };
                images[key].onerror = () => {
                    console.warn(`Failed to load asset: ${assetPaths[key]}. Fallbacks active.`);
                    assetsLoaded++;
                    if (assetsLoaded === totalAssets) callback();
                };
            }
        }

        // Save progress explicitly to localStorage
        function saveSkinProgress() {
            localStorage.setItem('kh_unlocked_skins', JSON.stringify(unlockedSkins));
            localStorage.setItem('kh_current_skin', currentSkinKey);
        }

        // Run checks to permanently unlock items based on passed requirements
        function checkPermanentUnlocks(clearedLevel) {
            skinConfig.forEach(skin => {
                if (clearedLevel >= skin.reqLevel - 1 && !unlockedSkins.includes(skin.key)) {
                    unlockedSkins.push(skin.key);
                }
            });
            saveSkinProgress();
        }

        function renderSkinMenu() {
            skinsContainer.innerHTML = '';
            skinConfig.forEach(skin => {
                const isLocked = !unlockedSkins.includes(skin.key);
                const card = document.createElement('div');
                card.className = `skin-card ${isLocked ? 'locked' : ''} ${currentSkinKey === skin.key ? 'selected' : ''}`;
                
                if (images[skin.key] && images[skin.key].naturalWidth > 0) {
                    const imgEl = document.createElement('img');
                    imgEl.src = assetPaths[skin.key];
                    imgEl.className = 'skin-preview';
                    card.appendChild(imgEl);
                } else {
                    const fallbackIcon = document.createElement('div');
                    fallbackIcon.className = 'skin-fallback-icon';
                    fallbackIcon.innerText = '🗡️';
                    card.appendChild(fallbackIcon);
                }

                const label = document.createElement('div');
                label.className = 'skin-label';
                label.innerText = isLocked ? `Lvl ${skin.reqLevel - 1} Clear` : skin.name;
                card.appendChild(label);

                if (!isLocked) {
                    card.addEventListener('click', () => {
                        currentSkinKey = skin.key;
                        saveSkinProgress();
                        renderSkinMenu();
                    });
                }
                skinsContainer.appendChild(card);
            });
        }

        function drawImageWithAspect(ctx, img, cx, cy, targetHeight, rotation = 0, anchorTop = false) {
            if (img && img.complete && img.naturalWidth > 0) {
                const aspect = img.naturalWidth / img.naturalHeight;
                const targetWidth = targetHeight * aspect;
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(rotation);
                if (anchorTop) {
                    ctx.drawImage(img, -targetWidth / 2, 0, targetWidth, targetHeight);
                } else {
                    ctx.drawImage(img, -targetWidth / 2, -targetHeight / 2, targetWidth, targetHeight);
                }
                ctx.restore();
                return true;
            }
            return false;
        }

        function drawLog(ctx, img, radius, scalePulse) {
            if (img && img.complete && img.naturalWidth > 0) {
                const aspect = img.naturalWidth / img.naturalHeight;
                let drawW, drawH;
                if (aspect >= 1) {
                    drawW = radius * 2 * scalePulse;
                    drawH = drawW / aspect;
                } else {
                    drawH = radius * 2 * scalePulse;
                    drawW = drawH * aspect;
                }
                ctx.drawImage(img, -drawW / 2, -drawH / 2, drawW, drawH);
                return true;
            }
            return false;
        }

        let KNIFE_HALF_ANGLE = 0.09;
        let APPLE_HALF_ANGLE = 0.18;
        const HIT_FORGIVENESS = 0.82;

        const EMBEDDED_KNIFE_HEIGHT = 85;
        const APPLE_SPRITE_HEIGHT = 40;

        const KNIFE_EMBED = 18;
        const APPLE_INSET = 8;

        function spriteWidth(img, targetHeight, fallbackWidth) {
            if (img && img.complete && img.naturalWidth > 0) {
                return targetHeight * (img.naturalWidth / img.naturalHeight);
            }
            return fallbackWidth;
        }

        function recalcHitAngles(radius) {
            const knifeWidth = spriteWidth(images[currentSkinKey], EMBEDDED_KNIFE_HEIGHT, 8);
            const appleWidth = spriteWidth(images.apple, APPLE_SPRITE_HEIGHT, 30);
            KNIFE_HALF_ANGLE = Math.atan((knifeWidth / 2) / radius) * HIT_FORGIVENESS;
            APPLE_HALF_ANGLE = Math.atan((appleWidth / 2) / radius) * HIT_FORGIVENESS;
        }

        const PRESET_GAP_PADDING = 0.12;

        let score = 0;
        let lives = 0;
        let currentLevel = 1;
        let gameState = 'START';
        let inputLocked = false;

        let log = {
            x: 0, y: 0,
            radius: 95,
            rotation: 0,
            baseSpeed: 0.025,
            speedModifier: 1,
            directionTimer: 0,
            scalePulse: 1,
            flashIntensity: 0
        };

        let screenShake = { x: 0, y: 0, duration: 0, intensity: 0 };
        let knivesRemaining = 7;
        let totalLevelKnives = 7;
        let activeKnife = null;
        let stuckKnives = [];
        let flyingApples = [];
        let particles = [];
        let failedKnife = null;

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            log.x = canvas.width / 2;
            log.y = canvas.height * 0.32;
            resetKnifePosition();
        }

        function resetKnifePosition() {
            if (gameState === 'PLAYING' && knivesRemaining > 0) {
                activeKnife = {
                    x: canvas.width / 2,
                    y: canvas.height * 0.82,
                    height: 90,
                    status: 'ready'
                };
                inputLocked = false;
            } else {
                activeKnife = null;
            }
        }

        function triggerShake(intensity, duration) {
            screenShake.intensity = intensity;
            screenShake.duration = duration;
        }

        function normalizeAngle(a) {
            a = a % (Math.PI * 2);
            if (a < 0) a += Math.PI * 2;
            return a;
        }

        function angleDifference(a, b) {
            let d = Math.abs(normalizeAngle(a) - normalizeAngle(b));
            if (d > Math.PI) d = Math.PI * 2 - d;
            return d;
        }

        function isTooClose(angle, occupied, minDist) {
            return occupied.some(a => angleDifference(a, angle) < minDist);
        }

        function initLevel(level) {
            currentLevel = level;
            levelVal.innerText = currentLevel;
            
            totalLevelKnives = 5 + Math.min(level, 6);
            knivesRemaining = totalLevelKnives;
            
            log.rotation = 0;
            log.baseSpeed = 0.02 + Math.min(level * 0.004, 0.04);

            log.speedModifier = 1;
            log.scalePulse = 1;
            log.flashIntensity = 0;
            log.directionTimer = 0;
            
            stuckKnives = [];
            flyingApples = [];
            failedKnife = null;
            inputLocked = false;

            recalcHitAngles(log.radius);

            const knifeMinSeparation = (KNIFE_HALF_ANGLE * 2) + PRESET_GAP_PADDING;
            const appleMinSeparation = KNIFE_HALF_ANGLE + APPLE_HALF_ANGLE + PRESET_GAP_PADDING;

            const occupied = [];
            const presetCount = Math.min(Math.floor(Math.random() * Math.min(level, 4)), 3);

            for (let i = 0; i < presetCount; i++) {
                let tries = 0;
                let angle;
                do {
                    angle = Math.random() * Math.PI * 2;
                    tries++;
                } while (isTooClose(angle, occupied, knifeMinSeparation) && tries < 20);

                if (tries < 20) {
                    stuckKnives.push({ angle, type: 'preset' });
                    occupied.push(angle);
                }
            }

            if (Math.random() > 0.3) {
                let tries = 0;
                let appleAngle;
                do {
                    appleAngle = Math.random() * Math.PI * 2;
                    tries++;
                } while (isTooClose(appleAngle, occupied, appleMinSeparation) && tries < 20);

                if (tries < 20) {
                    stuckKnives.push({ angle: appleAngle, type: 'apple', hit: false });
                }
            }

            gameState = 'PLAYING';
            overlay.classList.remove('active');
            resetKnifePosition();
        }

        function triggerScreen(state) {
            gameState = state;
            inputLocked = true;
            renderSkinMenu();

            if (state === 'START') {
                overlayTitle.innerText = "Knife Hit Master";
                overlaySubtitle.innerText = "Collect apples for extra lives!";
                actionBtn.innerText = "START GAME";
                overlay.classList.add('active');
            } else if (state === 'GAMEOVER') {
                overlayTitle.innerText = "GAME OVER";
                overlaySubtitle.innerText = `Stage Reached: ${currentLevel} | Score: ${score}`;
                actionBtn.innerText = "RESTART";
                overlay.classList.add('active');
                if (window.PlayVlay) PlayVlay.gameOver(score);
            } else if (state === 'LEVEL_COMPLETE') {
                overlayTitle.innerText = "STAGE CLEAR!";
                overlaySubtitle.innerText = "Get ready for the next challenge";
                actionBtn.innerText = "CONTINUE";
                overlay.classList.add('active');
            }
        }

        function throwKnife() {
            if (inputLocked || !activeKnife || activeKnife.status !== 'ready' || gameState !== 'PLAYING') return;
            activeKnife.status = 'flying';
            inputLocked = true;
        }

        window.addEventListener('resize', resizeCanvas);
        
        document.getElementById('game-container').addEventListener('mousedown', () => {
            if (gameState === 'PLAYING') throwKnife();
        });
        document.getElementById('game-container').addEventListener('touchstart', (e) => {
            if (gameState === 'PLAYING') {
                e.preventDefault();
                throwKnife();
            }
        });

        function handleStartAction() {
            if (gameState === 'START' || gameState === 'GAMEOVER') {
                score = 0;
                lives = 0;
                scoreVal.innerText = score;
                appleVal.innerText = lives;
                initLevel(1);
            } else if (gameState === 'LEVEL_COMPLETE') {
                initLevel(currentLevel + 1);
            }
        }

        actionBtn.addEventListener('click', handleStartAction);

        function update() {
            if (screenShake.duration > 0) {
                screenShake.x = (Math.random() - 0.5) * screenShake.intensity;
                screenShake.y = (Math.random() - 0.5) * screenShake.intensity;
                screenShake.duration -= 16;
            } else {
                screenShake.x = 0;
                screenShake.y = 0;
            }

            if (log.scalePulse > 1) log.scalePulse -= 0.02;
            if (log.flashIntensity > 0) log.flashIntensity -= 0.1;

            if (gameState === 'PLAYING') {
                log.directionTimer += 0.016;
                
                if (currentLevel >= 2) {
                    if (currentLevel % 2 === 0) {
                        log.speedModifier = Math.sin(log.directionTimer * 2);
                    } else {
                        log.speedModifier = (Math.floor(log.directionTimer * 1.5) % 2 === 0) ? 1.3 : -0.7;
                    }
                }
                
                log.rotation += log.baseSpeed * log.speedModifier;
                log.rotation = normalizeAngle(log.rotation);
            }

            if (activeKnife && activeKnife.status === 'flying') {
                activeKnife.y -= 48;

                const tipX = activeKnife.x;
                const tipY = activeKnife.y;

                const dx = tipX - log.x;
                const dy = tipY - log.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist <= log.radius + 2) {
                    const worldAngle = Math.atan2(dy, dx);
                    const hitAngle = normalizeAngle(worldAngle - log.rotation);

                    let collision = false;

                    for (let i = 0; i < stuckKnives.length; i++) {
                        const target = stuckKnives[i];

                        if (target.type === 'knife' || target.type === 'preset') {
                            if (angleDifference(target.angle, hitAngle) < KNIFE_HALF_ANGLE) {
                                collision = true;
                                break;
                            }
                        } else if (target.type === 'apple' && !target.hit) {
                            if (angleDifference(target.angle, hitAngle) < APPLE_HALF_ANGLE + KNIFE_HALF_ANGLE) {
                                target.hit = true;
                                lives += 1;
                                appleVal.innerText = lives;
                                triggerShake(6, 140);
                                createAppleCutEffect(
                                    log.x + Math.cos(target.angle + log.rotation) * log.radius,
                                    log.y + Math.sin(target.angle + log.rotation) * log.radius
                                );
                            }
                        }
                    }

                    if (collision) {
                        if (lives > 0) {
                            lives--;
                            appleVal.innerText = lives;
                            triggerShake(10, 200);

                            stuckKnives.push({ angle: hitAngle, type: 'knife' });
                            score += 1;
                            scoreVal.innerText = score;
                            if (window.PlayVlay) PlayVlay.reportScore(score);
                            knivesRemaining--;

                            log.scalePulse = 1.07;
                            log.flashIntensity = 0.35;
                            createImpactParticles(tipX, tipY, '#ffffff');

                            activeKnife = null;

                            if (knivesRemaining <= 0) {
                                checkPermanentUnlocks(currentLevel); // Save skin permanent status instantly
                                gameState = 'LEVEL_COMPLETE';
                                inputLocked = true;
                                setTimeout(() => triggerScreen('LEVEL_COMPLETE'), 450);
                            } else {
                                resetKnifePosition();
                            }
                        } else {
                            failedKnife = {
                                x: tipX, y: tipY,
                                vx: (Math.random() - 0.5) * 14,
                                vy: 5,
                                rotation: 0,
                                rotSpeed: 0.3,
                                height: activeKnife.height
                            };
                            activeKnife = null;
                            triggerShake(14, 320);
                            triggerScreen('GAMEOVER');
                        }
                    } else {
                        stuckKnives.push({ angle: hitAngle, type: 'knife' });
                        score += 1;
                        scoreVal.innerText = score;
                        if (window.PlayVlay) PlayVlay.reportScore(score);
                        knivesRemaining--;

                        log.scalePulse = 1.07;
                        log.flashIntensity = 0.35;
                        triggerShake(3, 90);
                        createImpactParticles(tipX, tipY, '#ffffff');

                        activeKnife = null;

                        if (knivesRemaining <= 0) {
                            checkPermanentUnlocks(currentLevel); // Save skin permanent status instantly
                            gameState = 'LEVEL_COMPLETE';
                            inputLocked = true;
                            setTimeout(() => triggerScreen('LEVEL_COMPLETE'), 450);
                        } else {
                            resetKnifePosition();
                        }
                    }
                }
            }

            if (failedKnife) {
                failedKnife.x += failedKnife.vx;
                failedKnife.y += failedKnife.vy;
                failedKnife.vy += 0.55;
                failedKnife.rotation += failedKnife.rotSpeed;
            }

            for (let i = flyingApples.length - 1; i >= 0; i--) {
                const p = flyingApples[i];
                p.x1 += p.vx1; p.y1 += p.vy1; p.vy1 += 0.4; p.r1 += p.vr1;
                p.x2 += p.vx2; p.y2 += p.vy2; p.vy2 += 0.4; p.r2 += p.vr2;
                p.life--;
                if (p.life <= 0) flyingApples.splice(i, 1);
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx; p.y += p.vy;
                p.vy += 0.2;
                p.alpha -= 0.04;
                if (p.alpha <= 0) particles.splice(i, 1);
            }
        }

        function createImpactParticles(x, y, color) {
            for (let i = 0; i < 12; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 1) * 5,
                    alpha: 1,
                    color,
                    size: Math.random() * 3 + 2
                });
            }
        }

        function createAppleCutEffect(x, y) {
            flyingApples.push({
                x1: x, y1: y, vx1: -5, vy1: -7, r1: 0, vr1: -0.15,
                x2: x, y2: y, vx2: 5, vy2: -5, r2: 0, vr2: 0.15,
                life: 60
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(screenShake.x, screenShake.y);

            const uiKnifeH = 25;
            const uiStartX = 25;
            const uiStartY = canvas.height * 0.85;
            
            for (let i = 0; i < totalLevelKnives; i++) {
                ctx.save();
                if (i < totalLevelKnives - knivesRemaining) ctx.globalAlpha = 0.15;
                if (!drawImageWithAspect(ctx, images[currentSkinKey], uiStartX, uiStartY - (i * (uiKnifeH + 10)), uiKnifeH)) {
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(uiStartX - 4, uiStartY - (i * (uiKnifeH + 10)) - uiKnifeH/2, 8, uiKnifeH);
                }
                ctx.restore();
            }

            stuckKnives.forEach(item => {
                const worldAngle = item.angle + log.rotation;

                if (item.type === 'knife' || item.type === 'preset') {
                    const tipDist = log.radius - KNIFE_EMBED;
                    const tipX = log.x + Math.cos(worldAngle) * tipDist;
                    const tipY = log.y + Math.sin(worldAngle) * tipDist;

                    ctx.save();
                    ctx.translate(tipX, tipY);
                    ctx.rotate(worldAngle - Math.PI / 2);
                    if (!drawImageWithAspect(ctx, images[currentSkinKey], 0, 0, EMBEDDED_KNIFE_HEIGHT, 0, true)) {
                        ctx.fillStyle = '#ddd';
                        ctx.fillRect(-4, 0, 8, 65);
                    }
                    ctx.restore();
                } else if (item.type === 'apple' && !item.hit) {
                    const dist = log.radius - APPLE_INSET;
                    const ax = log.x + Math.cos(worldAngle) * dist;
                    const ay = log.y + Math.sin(worldAngle) * dist;
                    if (!drawImageWithAspect(ctx, images.apple, ax, ay, APPLE_SPRITE_HEIGHT, worldAngle + Math.PI / 2)) {
                        ctx.beginPath();
                        ctx.fillStyle = '#ff3b30';
                        ctx.arc(ax, ay, 15, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            });

            ctx.save();
            ctx.translate(log.x, log.y);
            ctx.rotate(log.rotation);
            if (!drawLog(ctx, images.log, log.radius, log.scalePulse)) {
                const r = log.radius * log.scalePulse;
                ctx.beginPath();
                ctx.arc(0, 0, r, 0, Math.PI * 2);
                ctx.fillStyle = '#8B4513';
                ctx.fill();
                ctx.lineWidth = 6;
                ctx.strokeStyle = '#5c2d0c';
                ctx.stroke();
            }
            if (log.flashIntensity > 0) {
                ctx.globalAlpha = log.flashIntensity;
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(0, 0, log.radius * log.scalePulse - 2, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();

            flyingApples.forEach(p => {
                if (!drawImageWithAspect(ctx, images.appleCut, p.x1, p.y1, 35, p.r1)) {
                    ctx.fillStyle = '#ff3b30';
                    ctx.fillRect(p.x1, p.y1, 12, 12);
                }
                if (!drawImageWithAspect(ctx, images.appleCut, p.x2, p.y2, 35, p.r2)) {
                    ctx.fillStyle = '#ff3b30';
                    ctx.fillRect(p.x2, p.y2, 12, 12);
                }
            });

            if (activeKnife) {
                if (!drawImageWithAspect(ctx, images[currentSkinKey], activeKnife.x, activeKnife.y, activeKnife.height, 0, true)) {
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(activeKnife.x - 5, activeKnife.y, 10, activeKnife.height);
                }
            }

            if (failedKnife) {
                if (!drawImageWithAspect(ctx, images[currentSkinKey], failedKnife.x, failedKnife.y, failedKnife.height, failedKnife.rotation, true)) {
                    ctx.fillStyle = '#ff3b30';
                    ctx.fillRect(failedKnife.x - 5, failedKnife.y, 10, failedKnife.height);
                }
            }

            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
                ctx.restore();
            });

            ctx.restore();
        }

        let animationFrameId = null;
        function loop() {
            update();
            draw();
            animationFrameId = requestAnimationFrame(loop);
        }

        function playvlayStart() {
            gameState = 'START';
            handleStartAction();
        }

        function playvlayPause() {
            inputLocked = true;
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }
        }

        function playvlayResume() {
            if (gameState === 'PLAYING') {
                inputLocked = false;
            }
            if (!animationFrameId) {
                animationFrameId = requestAnimationFrame(loop);
            }
        }

        loadAssets(() => {
            recalcHitAngles(log.radius);
            resizeCanvas();
            renderSkinMenu();
            
            if (window.PlayVlay) {
                PlayVlay.onStart(playvlayStart);
                PlayVlay.onRestart(playvlayStart);
                PlayVlay.onPause(playvlayPause);
                PlayVlay.onResume(playvlayResume);
                PlayVlay.ready();
                animationFrameId = requestAnimationFrame(loop);
            } else {
                triggerScreen('START');
                animationFrameId = requestAnimationFrame(loop);
            }
        });
    </script>
</body>
